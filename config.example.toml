# Nectar configuration
# Default location: ~/.nectar/config.toml

[feishu]
app_id = "cli_xxxxxxxxxxxxxxxx"
app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
log_level = "info"

[codex]
path = "codex"
# model = "gpt-5.2-codex"
# effort = "high"
sandbox = "workspace-write"
working_dir = "~/.nectar/workspace"
timeout = "30m"
max_output_bytes = 2097152
# 0 = auto-detect from Codex model catalog; set e.g. 258000 to override
context_window = 0
per_chat_workspace = false
bypass_approvals = false

[opencode]
path = "opencode"
# model = "provider/model#variant"
# agent = "build"
working_dir = "~/.nectar/workspace"
timeout = "30m"
max_output_bytes = 2097152
context_window = 0            # 0 = read limit.context from OpenCode config
standalone = true
auto_approve = true
per_chat_workspace = false

[cursor]
path = "cursor-agent"
# model = "composer-2.5"
# mode = "plan"                 # plan | ask; empty = normal agent mode
# sandbox = "enabled"           # enabled | disabled; empty = Cursor default
working_dir = "~/.nectar/workspace"
timeout = "30m"
max_output_bytes = 2097152
context_window = 0
auto_approve = true             # -f; required for non-interactive bot use
trust_workspace = true          # --trust; required for headless runs
per_chat_workspace = false

[claude]
path = "claude"
# model = "claude-sonnet-4-5"   # empty = Claude Code default
# fallback_model = "claude-haiku-4-5"
# permission_mode = "acceptEdits" # acceptEdits | plan | bypassPermissions | manual | dontAsk | auto
working_dir = "~/.nectar/workspace"
timeout = "30m"
max_output_bytes = 2097152
context_window = 0             # 0 = read context_window from the result event
# max_turns = 0
auto_approve = true            # --dangerously-skip-permissions; required for headless runs
per_chat_workspace = false

[pi]
path = "pi"
# provider = "anthropic"
# model = "claude-sonnet-4-5"   # empty = Pi default model
# thinking = "high"             # off | minimal | low | medium | high | xhigh | max
working_dir = "~/.nectar/workspace"
timeout = "30m"
max_output_bytes = 2097152
context_window = 0             # 0 = unknown; footer omits context percentage
trust_workspace = true         # --approve; load project-local Pi resources
per_chat_workspace = false

[bot]
name = "Nectar"
engine = "codex"              # codex | opencode | cursor | claude | pi
agent_id = "codex"            # legacy; defaults to engine
# Feishu open_id list. When non-empty, DMs are restricted to these users.
admin_users = []
# Feishu chat_id list. When non-empty, only these groups are served.
allowed_chats = []

[storage]
data_dir = "~/.nectar"
