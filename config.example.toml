# Nectar configuration
# Default location: ~/.nectar/config.toml
#
# Only the selected platform's credentials are required. Every other section
# has built-in defaults and can be omitted.

[feishu]
# Feishu / Lark app credentials. Create an internal app, enable the bot, and
# use long-connection event delivery.
app_id = "cli_xxxxxxxxxxxxxxxx"
app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# Log level: debug | info | warn | error. Default: info.
log_level = "info"

# ---------------------------------------------------------------------------
# DingTalk
# ---------------------------------------------------------------------------
# To use DingTalk:
#   1. Create an internal app in the DingTalk Open Platform.
#   2. Enable the bot and select Stream mode.
#   3. Grant message permissions, plus AICard.Instance.Write for streaming cards.
#   4. Publish the app version.
#   5. Uncomment [dingtalk] and leave [feishu] credentials empty.
#
# No public callback URL, domain, HTTPS certificate, or card template is needed.
# client_id is the legacy AppKey; client_secret is the legacy AppSecret.
# [dingtalk]
# client_id = "dingxxxxxxxxxxxxxxxx"
# client_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# Log level: debug | info | warn | error. Default: info.
# log_level = "info"
# Robot code used for sending messages/cards/media. Default: client_id.
# robot_code = "dingxxxxxxxxxxxxxxxx"
# Enable A2UI streaming cards. Default: true. Set false to use Markdown only.
# Requires the AICard.Instance.Write permission; otherwise Nectar degrades to
# Markdown and shows a Thinking reaction when possible.
# card_enabled = true

# ---------------------------------------------------------------------------
# Telegram
# ---------------------------------------------------------------------------
# To use Telegram:
#   1. Create a bot with @BotFather and copy the bot token.
#   2. Uncomment [telegram] and leave the other platform credentials empty.
#   3. Optionally set bot.platform = "telegram" in [bot].
#
# Nectar uses Bot API long polling, so no public callback URL or certificate is
# needed. In mainland China, set proxy to an HTTP/SOCKS proxy that can reach
# api.telegram.org; background services do not inherit shell proxy variables.
# [telegram]
# bot_token = "your-bot-token"
# HTTP/SOCKS proxy used for Bot API requests. Empty = environment proxy.
# proxy = "http://127.0.0.1:7890"
# Optional self-hosted Bot API server. Default: https://api.telegram.org.
# api_base_url = "https://api.telegram.org"
# Log level: debug | info | warn | error. Default: info.
# log_level = "info"

# ---------------------------------------------------------------------------
# Codex CLI
# ---------------------------------------------------------------------------
[codex]
# Executable name or absolute path. Default: codex.
path = "codex"
# Codex transport: app-server | exec. Default: app-server.
# app-server enables /steer, /append, /ps, and /btw.
backend = "app-server"
# Model name. Empty = Codex default.
# model = "gpt-5.2-codex"
# Reasoning effort (e.g. minimal, low, medium, high). Empty = Codex default.
# effort = "high"
# Sandbox mode: read-only | workspace-write | danger-full-access.
sandbox = "workspace-write"
# Base workspace for agent runs. Default: ~/.nectar/workspace.
working_dir = "~/.nectar/workspace"
# Per-turn execution timeout. Default: 30m.
timeout = "30m"
# Maximum size of one app-server stdout event. Default: 2 MiB.
# With backend = "exec", this limits total JSONL output instead.
max_output_bytes = 2097152
# Context window used for the card footer. 0 = auto-detect from Codex's model
# catalog; set an explicit value (e.g. 258000) to override.
context_window = 0
# true = create a separate subdirectory per chat under working_dir.
per_chat_workspace = false
# true = pass --dangerously-bypass-approvals-and-sandbox. Use only in trusted
# environments; this disables Codex approvals and sandboxing.
bypass_approvals = false

# ---------------------------------------------------------------------------
# OpenCode
# ---------------------------------------------------------------------------
[opencode]
# Executable name or absolute path. Default: opencode.
path = "opencode"
# Model in provider/model#variant form. Empty = OpenCode default.
# model = "provider/model#variant"
# Agent name passed as --agent. Empty = OpenCode default.
# agent = "build"
# Base workspace for agent runs. Default: ~/.nectar/workspace.
working_dir = "~/.nectar/workspace"
# Per-turn execution timeout. Default: 30m.
timeout = "30m"
# Maximum captured stdout bytes. Default: 2 MiB.
max_output_bytes = 2097152
# Context window used for the card footer. 0 = read limit.context from the
# OpenCode model configuration.
context_window = 0
# false = use OpenCode's shared server, which is required for /steer.
standalone = false
# Optional existing shared server. When set, run/export/steer all use it and
# standalone is ignored. Example: "http://127.0.0.1:4096".
# server_url = ""
# true = pass --auto (non-interactive execution).
auto_approve = true
# true = create a separate subdirectory per chat under working_dir.
per_chat_workspace = false

# ---------------------------------------------------------------------------
# Cursor Agent CLI
# ---------------------------------------------------------------------------
[cursor]
# Executable name or absolute path. Default: agent. The legacy cursor-agent name is also supported.
path = "agent"
# Model name. Empty = Cursor default.
# model = "composer-2.5"
# Mode: plan | ask. Empty = normal agent mode.
# mode = "plan"
# Sandbox mode: enabled | disabled. Empty = Cursor default.
# sandbox = "enabled"
# Base workspace for agent runs. Default: ~/.nectar/workspace.
working_dir = "~/.nectar/workspace"
# Per-turn execution timeout. Default: 30m.
timeout = "30m"
# Maximum captured stdout bytes. Default: 2 MiB.
max_output_bytes = 2097152
# Context window used for the card footer. 0 = unknown/omit context usage.
context_window = 0
# true = pass -f (required for non-interactive bot use).
auto_approve = true
# true = pass --trust (required for headless runs).
trust_workspace = true
# true = create a separate subdirectory per chat under working_dir.
per_chat_workspace = false

# ---------------------------------------------------------------------------
# Claude Code
# ---------------------------------------------------------------------------
[claude]
# Executable name or absolute path. Default: claude.
path = "claude"
# Transport: stream-json | print. Default: stream-json (enables /steer).
backend = "stream-json"
# Model name. Empty = Claude Code default.
# model = "claude-sonnet-4-5"
# Fallback model used when the primary model is unavailable.
# fallback_model = "claude-haiku-4-5"
# Permission mode: acceptEdits | plan | bypassPermissions | manual | dontAsk | auto.
# permission_mode = "acceptEdits"
# Base workspace for agent runs. Default: ~/.nectar/workspace.
working_dir = "~/.nectar/workspace"
# Per-turn execution timeout. Default: 30m.
timeout = "30m"
# Maximum captured stdout bytes. Default: 2 MiB.
max_output_bytes = 2097152
# Context window used for the card footer. 0 = read from Claude's result event.
context_window = 0
# Maximum agent turns. 0 = CLI default/unlimited.
# max_turns = 0
# true = pass --dangerously-skip-permissions; takes precedence over
# permission_mode and is required for headless runs.
auto_approve = true
# true = create a separate subdirectory per chat under working_dir.
per_chat_workspace = false

# ---------------------------------------------------------------------------
# Pi
# ---------------------------------------------------------------------------
[pi]
# Executable name or absolute path. Default: pi.
path = "pi"
# Transport: rpc | json. Default: rpc (enables /steer).
backend = "rpc"
# Provider name passed as --provider. Empty = Pi default.
# provider = "anthropic"
# Model name. Empty = Pi default model.
# model = "claude-sonnet-4-5"
# Thinking level: off | minimal | low | medium | high | xhigh | max.
# thinking = "high"
# Base workspace for agent runs. Default: ~/.nectar/workspace.
working_dir = "~/.nectar/workspace"
# Per-turn execution timeout. Default: 30m.
timeout = "30m"
# Maximum captured stdout bytes. Default: 2 MiB.
max_output_bytes = 2097152
# Context window used for the card footer. 0 = unknown/omit context usage.
context_window = 0
# true = pass --approve and load project-local Pi resources.
trust_workspace = true
# true = create a separate subdirectory per chat under working_dir.
per_chat_workspace = false

# ---------------------------------------------------------------------------
# Bot behavior
# ---------------------------------------------------------------------------
[bot]
# Bot name. Default: Nectar.
name = "Nectar"
# Engine to use: codex | opencode | cursor | claude | pi.
engine = "codex"
# Platform to use: feishu | dingtalk | telegram. Empty = auto-detect from credentials.
# If both platforms have credentials, set this explicitly.
# platform = "feishu"
# Optional user allowlist.
# Feishu: open_id. DingTalk: sender staffId.
# Empty = allow any user who can reach the bot.
admin_users = []
# Optional group allowlist.
# Feishu: chat_id. DingTalk: openConversationId.
# Empty = allow any group the bot can reach.
allowed_chats = []
# Workspace mode: shared | per_chat | per_session | worktree | auto.
# auto creates a git worktree for each session when the workspace is a
# committed git repository, otherwise it falls back to per_chat.
workspace_mode = "shared"

# ---------------------------------------------------------------------------
# Additional bots
# ---------------------------------------------------------------------------
# Each entry runs as an independent bot in the same process with its own
# platform identity, engine, workspace, session store, and memory.
#
# [bots.reviewer]
# name = "Claude Reviewer"
# platform = "feishu"
# engine = "claude"
# workspace = "~/code/project"
# # New bots default to auto: git worktree when possible, otherwise per_chat.
# workspace_mode = "auto"
# admin_users = []
# allowed_chats = []
#
# [bots.reviewer.feishu]
# app_id = "cli_yyy"
# app_secret = "yyy"
#
# [bots.ops]
# name = "Ops"
# platform = "telegram"
# engine = "codex"
# workspace = "~/code/ops"
#
# [bots.ops.telegram]
# bot_token = "123456:replace-me"

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
[storage]
# Root directory for Nectar data. Default: ~/.nectar.
data_dir = "~/.nectar"

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
[memory]
# Enable the local-first memory store and prompt injection.
enabled = true
# Default scope for /remember and `nectar memory add`: bot | chat | project.
# "bot" shares memories across every chat handled by the same bot.
default_scope = "bot"
# Maximum number of memories injected into one agent turn.
max_items = 6
# Maximum characters of memory context injected into one prompt.
max_chars = 1500
# Record failed runs as pending memory candidates. Candidates are not injected
# until an admin approves them with /memory approve <id>.
auto_learn_failures = true

# ---------------------------------------------------------------------------
# Scheduled tasks
# ---------------------------------------------------------------------------
[schedule]
# Enable the in-process scheduler and local management socket.
enabled = true
# Default timezone for cron expressions. "Local" uses the host timezone.
timezone = "Local"
# On startup, run a missed task immediately when it is at most this old.
# Older one-shot tasks are marked missed; recurring tasks move to their next
# future occurrence. "0s" disables catch-up.
startup_grace = "5m"
# Keep at most this many completed/failed tasks. 0 keeps all history.
history_limit = 100
# Maximum number of scheduled runs executing at the same time. 0 = unlimited.
max_concurrent = 4
# Spread due recurring runs over a random delay up to this duration. "0s"
# disables it. One-shot tasks and manual runs are never delayed.
jitter = "0s"
# Default per-run timeout. Tasks can override it with --timeout. "0s" disables
# the scheduler deadline; the engine's own timeout still applies.
timeout = "30m"

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------
# Optional local web console for bot status, memory review, and scheduled
# task management. Disabled by default and loopback-only unless explicitly
# configured otherwise. Settings are read-only in the console; edit this file
# and restart the service to change configuration.
#
# [dashboard]
# enabled = false
# listen = "127.0.0.1:8787"
# token_file = "~/.nectar/run/dashboard.token"
# allow_remote = false
# read_only = false
