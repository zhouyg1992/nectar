<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 460" width="1200" height="460" role="img"
     aria-labelledby="title desc">
  <title id="title">How Nectar works</title>
  <desc id="desc">Feishu, DingTalk, and Telegram messages flow through the Nectar bridge to Codex, OpenCode, Cursor Agent, Claude Code, or Pi.</desc>

  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF5CF"/>
      <stop offset="1" stop-color="#FFD978"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#FFF7E3"/>
    </linearGradient>
    <g id="bee">
      <text x="0" y="0" dy=".35em" text-anchor="middle" font-size="28"
            font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🐝</text>
    </g>
  </defs>

  <rect x="10" y="10" width="1180" height="440" rx="28" fill="url(#panel)" stroke="#F0D9A8" stroke-width="1.5"/>

  <text x="170" y="60" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.4" fill="#9A7A3A">CHAT PLATFORMS</text>
  <text x="1030" y="60" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.4" fill="#9A7A3A">CODING AGENT ENGINES</text>

  <!-- Platform to Nectar -->
  <path id="flow-feishu" d="M300 112 C 370 112, 405 230, 470 230"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-dingtalk" d="M300 190 C 370 190, 405 230, 470 230"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-telegram" d="M300 268 C 370 268, 405 230, 470 230"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>

  <!-- Nectar to engines -->
  <path id="flow-codex" d="M730 230 C 800 230, 825 113, 900 113"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-opencode" d="M730 230 C 800 230, 825 179, 900 179"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-cursor" d="M730 230 C 800 230, 825 245, 900 245"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-claude" d="M730 230 C 800 230, 825 311, 900 311"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
  <path id="flow-pi" d="M730 230 C 800 230, 825 377, 900 377"
        fill="none" stroke="#E4B24C" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>

  <!-- Platform cards -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">
    <rect x="40" y="80" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="62" cy="112" r="5" fill="#3370FF"/>
    <text x="80" y="120" font-weight="650" fill="#3A2A12">Feishu / Lark</text>

    <rect x="40" y="158" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="62" cy="190" r="5" fill="#FF7A00"/>
    <text x="80" y="198" font-weight="650" fill="#3A2A12">DingTalk</text>

    <rect x="40" y="236" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="62" cy="268" r="5" fill="#229ED9"/>
    <text x="80" y="276" font-weight="650" fill="#3A2A12">Telegram</text>
  </g>

  <text x="170" y="326" text-anchor="middle" font-size="13" fill="#9A7A3A"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">More platforms coming:</text>
  <text x="170" y="346" text-anchor="middle" font-size="13" fill="#B09A68"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">WeCom / WeChat · Slack · …</text>

  <!-- Engine cards -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">
    <rect x="900" y="86" width="260" height="54" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="920" cy="113" r="5" fill="#10A37F"/>
    <text x="938" y="120" font-weight="650" fill="#3A2A12">Codex CLI</text>

    <rect x="900" y="152" width="260" height="54" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="920" cy="179" r="5" fill="#6B5BFF"/>
    <text x="938" y="186" font-weight="650" fill="#3A2A12">OpenCode</text>

    <rect x="900" y="218" width="260" height="54" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="920" cy="245" r="5" fill="#111827"/>
    <text x="938" y="252" font-weight="650" fill="#3A2A12">Cursor Agent</text>

    <rect x="900" y="284" width="260" height="54" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="920" cy="311" r="5" fill="#D97757"/>
    <text x="938" y="318" font-weight="650" fill="#3A2A12">Claude Code</text>

    <rect x="900" y="350" width="260" height="54" rx="16" fill="#FFFFFF" stroke="#EFDCB3" stroke-width="1.5"/>
    <circle cx="920" cy="377" r="5" fill="#2F9E7A"/>
    <text x="938" y="384" font-weight="650" fill="#3A2A12">Pi</text>
  </g>

  <text x="1030" y="430" text-anchor="middle" font-size="13" fill="#B09A68"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">More engines coming: Kimi Code · …</text>

  <!-- Nectar bridge -->
  <circle cx="600" cy="230" r="64" fill="#FCE8B2" opacity="0.55">
    <animate attributeName="r" values="58;68;58" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <rect x="470" y="140" width="260" height="180" rx="32" fill="url(#honey)" stroke="#E3B24B" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-size="46"
        font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🍯</text>
  <text x="600" y="288" text-anchor="middle" font-size="30" font-weight="800" fill="#4A2E00"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Nectar</text>
  <text x="600" y="311" text-anchor="middle" font-size="13" fill="#7A5A18"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">one bridge, any agent</text>

  <!-- One bee per side, cycling through every connection on that side. -->
  <g>
    <use href="#bee" xlink:href="#bee"/>
    <animateMotion dur="15s" repeatCount="indefinite"
                   path="M300 112 C 370 112, 405 230, 470 230
                         C 405 230, 370 112, 300 112
                         M300 190 C 370 190, 405 230, 470 230
                         C 405 230, 370 190, 300 190
                         M300 268 C 370 268, 405 230, 470 230
                         C 405 230, 370 268, 300 268"/>
  </g>
  <g>
    <use href="#bee" xlink:href="#bee"/>
    <animateMotion dur="20s" repeatCount="indefinite"
                   path="M730 230 C 800 230, 825 113, 900 113
                         C 825 113, 800 230, 730 230
                         M730 230 C 800 230, 825 179, 900 179
                         C 825 179, 800 230, 730 230
                         M730 230 C 800 230, 825 245, 900 245
                         C 825 245, 800 230, 730 230
                         M730 230 C 800 230, 825 311, 900 311
                         C 825 311, 800 230, 730 230
                         M730 230 C 800 230, 825 377, 900 377
                         C 825 377, 800 230, 730 230"/>
  </g>
</svg>
